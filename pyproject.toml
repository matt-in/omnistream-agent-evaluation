[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnistream-agent-evaluation"
version = "0.3.0"
description = "Agent orchestration and evaluation tools for OmniStreamRAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
omni = "omnistream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
