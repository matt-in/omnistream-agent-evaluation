name: Verify agent and evaluation

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run tests and fixture checks
        run: python verify.py --verbose --output results/ci
